# render.yaml — Deployment config for Render.com free tier
#
# Timetable data lives in the "timetable-latest" GitHub Release (built
# weekly by .github/workflows/update-timetable.yml) and is fetched on
# app startup by api/timetable_db.py if data/timetable.sqlite is missing.
# This keeps the git repo small and is robust to Render's build-artifact
# packaging (which can exclude files matched by .gitignore).
#
# SETUP STEPS:
#   1. Create a free account at https://render.com
#   2. Click "New +" → "Web Service"
#   3. Connect your GitHub repository
#   4. Render will auto-detect this file and configure itself
#   5. In the Render dashboard, go to:
#        Service → Environment → Add Environment Variable
#      Add:
#        BODS_API_KEY   = <your BODS API key>
#        ALLOWED_ORIGIN = https://your-site.example   (only for an extra origin)
#
#      ALLOWED_ORIGIN is the CORS allowlist and IS read by api/main.py.
#      It is OPTIONAL: api.main already carries the site's canonical origins
#      (worthingbrightonbus.co.uk and the dennislemennace.github.io URL it
#      replaced) in DEFAULT_ALLOWED_ORIGINS, and this var ADDS to them rather
#      than replacing them — so a stale dashboard value cannot take the site
#      off its own API. Set it only to allow an extra origin, such as a preview
#      deployment; comma-separate for several. Unset fails closed on the
#      canonical origins rather than opening a wildcard. Any localhost port is
#      always allowed, for the local preview flow.
#
#      Optional:
#        DEBUG_ENABLED  = 1   exposes /api/debug/* and /docs. LEAVE UNSET in
#                             production — those routes re-expose the raw BODS
#                             and TransportAPI feeds and can spend metered
#                             quota. Set it only while diagnosing, then unset.
#   6. Copy the deploy hook URL from Settings → Deploy Hook and add it
#      to the GitHub repo as secret RENDER_DEPLOY_HOOK so the weekly
#      workflow can trigger a redeploy after publishing fresh data.

services:
  - type: web
    name: adur-worthing-bus-api
    runtime: python
    # Pinned. Without it Render picks a default that can move under the
    # service, and the audit environment (3.14) and CI (3.11) had already
    # diverged from each other with nothing recording which was intended.
    runtimeVersion: "3.11"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BODS_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      # Diagnostics stay off unless this is set. Deliberately has no
      # default: a fresh deploy should be closed.
      - key: DEBUG_ENABLED
        sync: false
