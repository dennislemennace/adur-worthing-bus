name: Keep scheduled workflows alive

# GitHub switches off a public repository's scheduled workflows after 60 days
# with no activity. The nightly processor stopped committing on 23 September
# 2026, so a quiet two months would end the record without a word: no nightly
# run, no weekly timetable, and raw days expiring unprocessed.
#
# Once a week this re-enables every scheduled workflow, itself included. If the
# repository has had no commit for 45 days it also makes an empty one, which is
# activity by any definition, well inside the 60.

on:
  schedule:
    - cron: "40 4 * * 1"          # Mondays, after the nightly run
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in process-snapshots.yml update-timetable.yml keep-warm.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "enabled $wf" || echo "::warning::could not enable $wf"
          done

      - name: Commit if the repository has gone quiet
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "last commit $AGE_DAYS days ago"
          if [ "$AGE_DAYS" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled workflows alive ($AGE_DAYS days without a commit)"
            git push
          fi
