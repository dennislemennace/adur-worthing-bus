name: Update Timetable Data

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Two runs of this must not interleave: they both push to main and both move
# the same rolling release tag.
concurrency:
  group: timetable-release
  cancel-in-progress: false

jobs:
  # Nothing is published unless the suites pass. This gate did not exist: the
  # build compiled three scripts, counted rows, and shipped.
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      # The pinned set, not an unpinned `pip install httpx`: the build that
      # produces the published artefact should be the one the tests ran under.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          python -m py_compile scripts/build_timetable.py
          python -m py_compile scripts/json_to_sqlite.py
          python -m py_compile scripts/build_evidence.py

      - name: Build timetable JSON
        run: python -u scripts/build_timetable.py

      - name: Convert to SQLite
        run: python -u scripts/json_to_sqlite.py

      # Non-empty is not the same as correct. This checks the properties the
      # audit found broken — overnight times folded into the morning, stop
      # order re-derived from departure times, services with no calendar at
      # all — none of which a row count can see.
      - name: Check output
        run: python -u scripts/check_timetable.py data/timetable.sqlite

      - name: Recompute published statistics
        run: python -u scripts/build_evidence.py

      - name: Validate refreshed statistics
        run: python -m pytest -q tests/test_curated_data.py

      - name: Generate SHA-256 sidecar
        run: |
          sha256sum data/timetable.sqlite | awk '{print $1}' > data/timetable.sqlite.sha256
          echo "Sidecar:"
          cat data/timetable.sqlite.sha256

      # A dated release is created first and kept, then the rolling tag is
      # updated in place. The old sequence deleted the rolling release and
      # then created it, so any failure in between left the API with nothing
      # to download and no previous version to fall back to.
      - name: Publish a dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATED="timetable-$(date -u +%Y-%m-%d-%H%M)"
          echo "DATED_TAG=$DATED" >> "$GITHUB_ENV"
          gh release create "$DATED" \
            data/timetable.sqlite data/timetable.sqlite.sha256 \
            --target "$GITHUB_SHA" \
            --title "Timetable $(date -u +%Y-%m-%d)" \
            --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) by $GITHUB_WORKFLOW"

      - name: Move the rolling release to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="timetable-latest"
          # --clobber replaces the assets on the existing release rather than
          # deleting the release itself, so the download URL never 404s.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              data/timetable.sqlite data/timetable.sqlite.sha256 --clobber
            gh release edit "$TAG" \
              --title "Timetable $(date -u +%Y-%m-%d)" \
              --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from $DATED_TAG"
          else
            gh release create "$TAG" \
              data/timetable.sqlite data/timetable.sqlite.sha256 \
              --title "Timetable $(date -u +%Y-%m-%d)" \
              --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from $DATED_TAG"
          fi

      # The site reads data/boundary_evidence.json from GitHub Pages, so fresh
      # figures have to land in the repo — publishing them to the release
      # alongside the database would leave the page quoting whatever numbers
      # were committed by hand, which is the failure this build step exists to
      # prevent.
      - name: Commit refreshed statistics
        run: |
          if git diff --quiet -- data/boundary_evidence.json; then
            echo "Statistics unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boundary_evidence.json
          git commit -m "Recompute boundary statistics from the $(date -u +%Y-%m-%d) timetable"
          git push

      # Rolling back is `gh release upload timetable-latest <assets from a
      # dated release> --clobber`. Keeping the dated releases is what makes
      # that possible; there was previously nothing to roll back to.
      - name: Prune old dated releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName \
            --jq '.[].tagName | select(startswith("timetable-2"))' \
            | sort -r | tail -n +6 \
            | while read -r old; do
                echo "Removing $old"
                gh release delete "$old" --yes --cleanup-tag || true
              done

      - name: Trigger Render redeploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping redeploy."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
