name: Update Timetable Data

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Two runs of this must not interleave: they both push to main and both move
# the same rolling release tag.
concurrency:
  group: timetable-release
  cancel-in-progress: false

jobs:
  # Nothing is published unless the suites pass. This gate did not exist: the
  # build compiled three scripts, counted rows, and shipped.
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      # One test is skipped here and only here. It asserts that the figures
      # quoted in objectives.json still match data/boundary_evidence.json — and
      # this job runs *before* the build regenerates that evidence, so it is
      # comparing the prose against the very file about to be replaced.
      #
      # That made a deadlock. Changing a quoted figure needs the regenerated
      # evidence, and regenerating it was gated behind a check against the old
      # evidence, so the build could never run: South Portslade moved from
      # 116.8 to 117.0 departures per stop and the timetable release was stuck
      # until the pair could be landed simultaneously, which nothing could do.
      #
      # Nothing is lost. The build's own "Validate refreshed statistics" step
      # runs the same test after recomputation, against the evidence actually
      # about to be published, which is the version of the question worth
      # asking. Push and pull-request runs pass no input and stay strict, so
      # the committed pair is still guarded on every commit.
      deselect: tests/test_curated_data.py::test_objective_prose_matches_the_evidence_it_cites

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      # The pinned set, not an unpinned `pip install httpx`: the build that
      # produces the published artefact should be the one the tests ran under.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          python -m py_compile scripts/build_timetable.py
          python -m py_compile scripts/json_to_sqlite.py
          python -m py_compile scripts/build_evidence.py
          python -m py_compile scripts/build_stops_json.py

      - name: Build timetable JSON
        run: python -u scripts/build_timetable.py

      - name: Convert to SQLite
        run: python -u scripts/json_to_sqlite.py

      # Non-empty is not the same as correct. This checks the properties the
      # audit found broken — overnight times folded into the morning, stop
      # order re-derived from departure times, services with no calendar at
      # all — none of which a row count can see.
      - name: Check output
        run: python -u scripts/check_timetable.py data/timetable.sqlite

      # The map's stop layer, as a static file on Pages. Built from the same
      # database this run publishes, so the two cannot describe different
      # weeks — and built by the same Timetable.stop_list() the API serves
      # from, so they cannot disagree about what a stop list is.
      - name: Build the static stop list
        run: python -u scripts/build_stops_json.py

      - name: Recompute published statistics
        run: python -u scripts/build_evidence.py

      - name: Validate refreshed statistics
        run: python -m pytest -q tests/test_curated_data.py

      - name: Generate SHA-256 sidecar
        run: |
          sha256sum data/timetable.sqlite | awk '{print $1}' > data/timetable.sqlite.sha256
          echo "Sidecar:"
          cat data/timetable.sqlite.sha256

      # A dated release is created first and kept, then the rolling tag is
      # updated in place. The old sequence deleted the rolling release and
      # then created it, so any failure in between left the API with nothing
      # to download and no previous version to fall back to.
      - name: Publish a dated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATED="timetable-$(date -u +%Y-%m-%d-%H%M)"
          echo "DATED_TAG=$DATED" >> "$GITHUB_ENV"
          gh release create "$DATED" \
            data/timetable.sqlite data/timetable.sqlite.sha256 \
            --target "$GITHUB_SHA" \
            --title "Timetable $(date -u +%Y-%m-%d)" \
            --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) by $GITHUB_WORKFLOW"

      - name: Move the rolling release to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="timetable-latest"
          # --clobber replaces the assets on the existing release rather than
          # deleting the release itself, so the download URL never 404s.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              data/timetable.sqlite data/timetable.sqlite.sha256 --clobber
            gh release edit "$TAG" \
              --title "Timetable $(date -u +%Y-%m-%d)" \
              --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from $DATED_TAG"
          else
            gh release create "$TAG" \
              data/timetable.sqlite data/timetable.sqlite.sha256 \
              --title "Timetable $(date -u +%Y-%m-%d)" \
              --notes "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from $DATED_TAG"
          fi

      # The site reads data/boundary_evidence.json from GitHub Pages, so fresh
      # figures have to land in the repo — publishing them to the release
      # alongside the database would leave the page quoting whatever numbers
      # were committed by hand, which is the failure this build step exists to
      # prevent.
      - name: Commit refreshed statistics and stop list
        run: |
          if git diff --quiet -- data/boundary_evidence.json data/stops.json; then
            echo "Statistics and stop list unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boundary_evidence.json data/stops.json
          git commit -m "Refresh boundary statistics and stop list from the $(date -u +%Y-%m-%d) timetable"
          git push

      # Dated releases are evidence inputs. Do not prune a timetable that an
      # immutable observation build may reference. Each reliability archive
      # also retains its exact input timetable and full hash.

      - name: Trigger Render redeploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — skipping redeploy."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
