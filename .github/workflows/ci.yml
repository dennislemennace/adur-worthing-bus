name: Tests

# The only committed workflow used to be the weekly timetable build, and it
# ran none of the test suites. Every defect the pre-release audit found was
# present while everything green — because nothing was checking on a push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # the timetable build gates itself on this
    inputs:
      deselect:
        description: >
          One pytest node id to skip, for a caller that is about to regenerate
          the very file a check compares against. Empty on push and pull
          request, which stay strict.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q ${{ inputs.deselect && format('--deselect {0}', inputs.deselect) || '' }}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      # No package install: both suites use Node's built-in test runner.
      - run: node --test --test-isolation=none "tests/*.mjs" "worker/test/*.js"
