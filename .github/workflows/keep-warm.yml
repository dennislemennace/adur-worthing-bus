name: Keep the API warm (backup)

# BACKUP ONLY. The real keep-warm is the Cloudflare Worker's cron trigger
# (worker/wrangler.toml, keepWarm() in worker/src/index.js). This schedule is
# set to every ten minutes but GitHub runs schedules as best effort: between
# 12 and 13 September 2026 it ran 13 times in 38 hours instead of about 228,
# median gap 163 minutes, so on its own it kept nothing warm. It stays because
# a stray run costs nothing and helps if the Worker is ever down.
#
# The backend runs on Render's free tier: it spins down after 15 minutes with
# no traffic and takes about 20 seconds to come back. A measured cold start
# was 22.4 seconds to first byte, against 0.15 seconds warm.
#
# So: a request every 10 minutes keeps it up between 07:30 and 23:30 London
# time, when people are travelling. Outside that it is left to sleep, and the
# first visitor gets the "waking up" banner and a static map while it starts.
#
# Allowance. Render gives 750 free instance-hours a month per workspace. The
# first ping at 07:30 wakes the service; the last, at 23:20, keeps it up until
# about 23:35. That is roughly 16 hours a day, about 500 in a 31-day month, or
# two thirds of the allowance. The third left over is deliberate: every
# overnight visit wakes the service for at least 15 minutes, redeploys count,
# and a second free service in the same workspace would share the same 750.
#
# The previous window (asleep only 01:30 to 06:30) used about 597 hours, 80%.
#
# Ten minutes, not fourteen: scheduled workflows are regularly delayed at peak
# times, and a slip past the 15-minute idle threshold would let the container
# sleep and put a cold start in front of whoever arrives next.
#
# Note: GitHub disables scheduled workflows in a repository with no commits
# for 60 days. If cold starts return, check that this is still enabled.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A backlog of delayed runs is worth nothing — the latest ping is the only one
# that matters.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: https://adur-worthing-bus.onrender.com/
      # Local time, not UTC. A window fixed in UTC would be an hour out for
      # half the year, and this one is chosen around when people travel.
      # Pings run from WARM_FROM up to, but not including, WARM_TO.
      WARM_FROM: "0730"
      WARM_TO:   "2330"

    steps:
      - name: Only inside the warm window
        id: window
        run: |
          NOW=$(TZ=Europe/London date +%H%M)
          echo "London time: $NOW"
          # Test for being *inside* the warm hours, not for being inside the
          # quiet ones. The quiet period runs 23:30 to 07:30 and so crosses
          # midnight, where a "from < now < to" test can never be true: the
          # old overnight check written that way would have skipped nothing
          # and pinged around the clock. The warm window does not cross
          # midnight, so plain HHMM string comparison is safe here.
          if [ ! "$NOW" \< "$WARM_FROM" ] && [ "$NOW" \< "$WARM_TO" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Outside $WARM_FROM–$WARM_TO, letting it sleep."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping the API
        if: steps.window.outputs.skip != 'true'
        run: |
          # Three tries. One failure is a blip and not worth a notification;
          # three in a row over a minute is an outage the owner should hear
          # about, so the job fails and GitHub says so.
          for attempt in 1 2 3; do
            # Generous timeout: waking the container *is* the job, and a cold
            # start takes about 20 seconds.
            if curl -fsS --max-time 60 -o /dev/null -w "attempt $attempt: HTTP %{http_code} in %{time_total}s\n" "$API_URL"; then
              exit 0
            fi
            echo "attempt $attempt failed"
            # Not `[ ... ] && sleep`: under `set -e` that AND-list returns
            # non-zero on the last attempt and would exit before the message.
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::The API did not respond to three requests over a minute."
          exit 1
