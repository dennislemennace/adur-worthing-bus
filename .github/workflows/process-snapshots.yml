name: Process Snapshots
# Named by day so a catch-up can see which days have already failed once.
run-name: "Process Snapshots ${{ inputs.day || 'yesterday' }}${{ inputs.catch_up == 'true' && ' (catch-up)' || '' }}"

# Turn yesterday's recorded feed snapshots into arrival observations.
#
# The Worker records a snapshot a minute into R2 (`worker/src/recorder.js`);
# this reads a day of them and measures punctuality against the timetable.
#
# **Why a nightly Action and not the Worker or Render.** Render's free tier has
# no disk and sleeps, and its cron is a paid feature. The Worker has 10 ms of
# CPU an invocation, nowhere near enough to match a day of positions against a
# timetable. Derived documents are uploaded to a separate public-read bucket
# after validation; immutable replay archives are attached to run-specific releases.
#
# GitHub's schedules are unreliable — 13 runs in 38 hours, measured — which is
# why they are not used for *recording*, where a missed minute is a hole in the
# evidence. For a nightly batch it does not matter: if this fires at 04:10
# instead of 03:20, yesterday's snapshots are still sitting in R2.

on:
  schedule:
    # 03:20 UTC: past midnight in both BST and GMT, so "yesterday" is a
    # complete London recording date. RT covers the whole night; GTFS service
    # days spanning two dates are merged by their explicit instance identity.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Service day to process (YYYY-MM-DD). Blank means yesterday."
        required: false
        type: string
      min_objects_per_feed:
        description: "Re-runs only: stop before processing unless each feed has at least this many objects. Blank means no check."
        required: false
        type: string
      catch_up:
        description: "Set by the pipeline itself when it processes a day a previous night missed."
        required: false
        type: string

permissions:
  contents: write
  # To start a catch-up run for a day a previous night missed.
  actions: write

# Serialise builds so each manifest names the previous complete generation.
concurrency:
  group: reliability-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The matcher these figures rest on. If it is broken, publishing a
      # punctuality number is worse than publishing nothing at all.
      - name: Test the matcher and the processor
        run: python -m pytest -q tests/test_trip_match.py tests/test_process_snapshots.py tests/test_review_accuracy.py tests/test_delay_hotspots.py tests/test_publication_bundle.py tests/test_schedule_record.py

      - name: Choose the day
        id: day
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="$REQUESTED_DAY"
          if [ -z "$DAY" ]; then
            # Yesterday in London: the service day just finished.
            DAY=$(TZ=Europe/London date -d "yesterday" +%Y-%m-%d)
          fi
          python -c 'import datetime, sys; datetime.date.fromisoformat(sys.argv[1])' "$DAY"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Processing $DAY"

      # Built weekly by update-timetable.yml and published as a release asset:
      # 59 MB, too large for the repo and far too slow to rebuild nightly.
      # A day must be measured against a timetable that describes it.
      #
      # BODS bundles look forward, so `timetable-latest` does not necessarily
      # cover yesterday: the build fetched on 20 September 2026 ran from
      # 20260920 and said nothing about the 18th. Processing the 18th against it
      # left every service inactive — nothing scheduled, nothing matched — and
      # published a day of zeroes that every downstream check found
      # self-consistent. 18 and 19 September both went out that way.
      #
      # Every weekly build is archived under a dated tag, so the recovery is to
      # walk those newest-first and take the first one that was actually in
      # force. Failing that, stop: process_snapshots.py would refuse the day
      # anyway, and stopping is the point.
      - name: Fetch a timetable that covers the day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY="${{ steps.day.outputs.day }}"
          mkdir -p data

          fetch() {
            gh release download "$1" --pattern 'timetable.sqlite*' \
              --dir data --clobber
            # The sidecar exists to be checked, not shipped and ignored.
            ( cd data && sha256sum -c \
                <(printf '%s  timetable.sqlite\n' "$(cat timetable.sqlite.sha256)") )
          }

          fetch timetable-latest
          if python scripts/timetable_covers.py \
               --timetable data/timetable.sqlite --day "$DAY"; then
            echo "TIMETABLE_TAG=timetable-latest" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::warning::timetable-latest does not cover $DAY — looking for the build that was in force"
          TAGS=$(gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100' \
                   --jq '.[].tag_name' \
                 | grep -E '^timetable-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}$' \
                 | sort -r)
          for TAG in $TAGS; do
            echo "trying $TAG"
            fetch "$TAG"
            if python scripts/timetable_covers.py \
                 --timetable data/timetable.sqlite --day "$DAY"; then
              echo "::notice::measuring $DAY against $TAG"
              echo "TIMETABLE_TAG=$TAG" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "::error::no archived timetable covers $DAY — not publishing an empty day"
          exit 1

      - name: Fetch the day's snapshots from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksum headers newer AWS CLI versions send by
          # default, with an error that never mentions checksums.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          DAY="${{ steps.day.outputs.day }}"
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          mkdir -p "snapshots/$DAY" "gtfs-rt/$DAY"
          aws s3 sync \
            "s3://adur-worthing-reliability/raw/$DAY/" "snapshots/$DAY/" \
            --endpoint-url "$ENDPOINT" --no-progress
          # The other feed of the same minutes. It states which journey each
          # bus is running, which is the one thing SIRI-VM does not say. Days
          # recorded before it existed simply have none, and are measured the
          # old way.
          aws s3 sync \
            "s3://adur-worthing-reliability/rt/$DAY/" "gtfs-rt/$DAY/" \
            --endpoint-url "$ENDPOINT" --no-progress
          SIRI=$(find "snapshots/$DAY" -name '*.xml' 2>/dev/null | wc -l)
          RT=$(find "gtfs-rt/$DAY" -name '*.pb' 2>/dev/null | wc -l)
          echo "SIRI-VM objects: $SIRI"
          echo "GTFS-RT objects: $RT"
          COUNT=$(find "snapshots/$DAY" "gtfs-rt/$DAY" -type f | wc -l)
          echo "Downloaded $COUNT snapshots"
          # A re-run replaces a day already published. Raw objects leave R2 after
          # seven days, so one that has started to go would swap a complete old
          # measurement for a partial new one: the caller can demand a floor.
          MIN="${{ inputs.min_objects_per_feed }}"
          if [ -n "$MIN" ] && { [ "$SIRI" -lt "$MIN" ] || [ "$RT" -lt "$MIN" ]; }; then
            echo "::error::$DAY has $SIRI SIRI-VM and $RT GTFS-RT objects, under the requested $MIN each — not replacing the published day"
            exit 1
          fi
          # Object counts are only a download sanity check, not recording coverage.
          # Processing publishes parsed, fresh and matched counters independently
          # per feed; two objects from one minute never count as two minutes.
          if [ "$COUNT" -lt 600 ]; then
            if [ -n "${{ inputs.day }}" ]; then
              # A named day is someone deliberately processing a part-day, such
              # as the first afternoon of recording. Their figures, their call.
              echo "::warning::only $COUNT snapshots for $DAY — coverage will be partial"
            else
              echo "::error::only $COUNT snapshots for $DAY (download sanity floor 600 combined feed objects) — not publishing"
              exit 1
            fi
          fi

      - name: Measure the day
        run: |
          DAY="${{ steps.day.outputs.day }}"
          mkdir -p data/reliability
          RT=""
          [ -d "gtfs-rt/$DAY" ] && RT="--gtfs-rt gtfs-rt/$DAY"
          python -u scripts/process_snapshots.py \
            --day "$DAY" \
            --snapshots "snapshots/$DAY" \
            $RT \
            --timetable data/timetable.sqlite \
            --out "observations-$DAY.json" \
            --summary-out "data/reliability/$DAY.json"
          gzip -9 "observations-$DAY.json"

      - name: Restore every known input and archive replay evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.day.outputs.day }}"
          TAG="reliability-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          echo "EVIDENCE_TAG=$TAG" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --retry 3 \
            https://adur-worthing-submissions.dennislemennace.workers.dev/journey-times/index.json \
            -o previous-index.json
          python scripts/prepare_reliability_inputs.py \
            --day "$DAY" --current "observations-$DAY.json.gz" \
            --previous-index previous-index.json --release-base "$BASE" \
            --repository "$GITHUB_REPOSITORY" --out inputs
          python scripts/archive_reliability_evidence.py \
            --observations "observations-$DAY.json.gz" --snapshots snapshots --rt gtfs-rt \
            --timetable data/timetable.sqlite --out evidence.tar.gz > evidence.json
          python - "$BASE" <<'PYMETA'
          import json, sys
          from pathlib import Path
          p = Path("evidence.json")
          d = json.loads(p.read_text())
          d["url"] = sys.argv[1] + "/evidence.tar.gz"
          p.write_text(json.dumps(d, sort_keys=True))
          sources_path = Path("inputs/sources.json")
          sources = json.loads(sources_path.read_text())
          for source in sources:
              if source["day"] == d["day"]:
                  source["evidence"] = d
          sources_path.write_text(json.dumps(sources, sort_keys=True))
          PYMETA

      - name: Build and validate the whole candidate before publishing
        run: |
          DAY="${{ steps.day.outputs.day }}"
          MONTH="${DAY:0:7}"
          python scripts/build_journey_times.py --observations inputs/window \
            --out journey-times --timetable data/timetable.sqlite
          python scripts/query_reliability.py --observations inputs/month \
            --rollup "rollup-$MONTH.json"
          python scripts/build_delay_hotspots.py --observations inputs/window --out hotspot-preview.json \
            --map-out hotspot-map --timetable data/timetable.sqlite --map-day "$DAY"
          # One artifact per service map, validated with the rest of the candidate.
          MAP_ARTIFACTS=()
          for f in hotspot-map/*.json; do MAP_ARTIFACTS+=(--artifact "$(basename "$f")=$f"); done
          python scripts/check_published.py --journey-times journey-times \
            --summaries "data/reliability/$DAY.json" "rollup-$MONTH.json"
          python scripts/publication_bundle.py --journey-times journey-times \
            --artifact "observations-$DAY.json.gz=observations-$DAY.json.gz" \
            --artifact "summary-$DAY.json=data/reliability/$DAY.json" \
            --artifact "rollup-$MONTH.json=rollup-$MONTH.json" \
            --artifact "hotspot-preview.json=hotspot-preview.json" \
            "${MAP_ARTIFACTS[@]}" \
            --sources inputs/sources.json --evidence evidence.json \
            --previous-index previous-index.json --out candidate > build-id.txt
          # No empty or partly validated generation can reach the upload steps.
          tar -czf publication.tar.gz -C candidate .

      - name: Publish immutable evidence and validated generation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This tag names this run and attempt; no asset is replaced in place.
          gh release create "$EVIDENCE_TAG" --latest=false --title "Reliability evidence $EVIDENCE_TAG" \
            --notes "Immutable recorded inputs, exact timetable and processing code, source observations and validated publication. Read index.json in publication.tar.gz for lineage and caveats."
          gh release upload "$EVIDENCE_TAG" evidence.tar.gz evidence.json publication.tar.gz \
            inputs/publish-assets/*.json.gz

      - name: Upload generation and switch one public manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PUBLISH_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUILD=$(cat build-id.txt)
          # Leave headroom for raw recording: published data has its own 4 GiB cap.
          aws s3 ls s3://adur-worthing-published/ --recursive --summarize \
            --endpoint-url "$ENDPOINT" > published-usage.txt
          USED=$(awk '/Total Size:/ {print $3}' published-usage.txt)
          test -n "$USED"
          SIZE=$(du -sb candidate | cut -f1)
          test "$((USED + SIZE))" -le 4294967296
          aws s3 cp "candidate/builds/$BUILD/" \
            "s3://adur-worthing-published/journey-times/builds/$BUILD/" \
            --recursive --endpoint-url "$ENDPOINT" --no-progress
          # Read back every object and check its bytes before exposing this generation.
          aws s3 sync "s3://adur-worthing-published/journey-times/builds/$BUILD/" \
            verified-generation --endpoint-url "$ENDPOINT" --no-progress
          python - "$BUILD" <<'PYVERIFY'
          import hashlib, sys
          from pathlib import Path
          base = Path("candidate/builds") / sys.argv[1]
          for path in base.iterdir():
              remote = Path("verified-generation") / path.name
              if not remote.exists() or hashlib.sha256(path.read_bytes()).digest() != hashlib.sha256(remote.read_bytes()).digest():
                  raise SystemExit("Publication read-back failed: " + path.name)
          PYVERIFY
          # Sole mutable pointer; old builds remain available to cached/shared links.
          aws s3 cp candidate/index.json s3://adur-worthing-published/journey-times/index.json \
            --endpoint-url "$ENDPOINT" --content-type application/json --no-progress

      # A night that failed leaves its day unprocessed. The recorder now keeps a
      # raw day until the published catalogue names it, so the day is still there
      # to process: start a run for the oldest one. Each catch-up ends here too,
      # so a backlog clears one day at a time. A day whose catch-up has already
      # failed is left for a person, rather than retried every night.
      - name: Catch up a day a previous night missed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          GH_TOKEN: ${{ github.token }}
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for feed in raw rt; do
            aws s3 ls "s3://adur-worthing-reliability/$feed/" --endpoint-url "$ENDPOINT" || true
          done | awk '$1 == "PRE" {print $2}' | tr -d / | sort -u > recorded-days.txt
          gh run list --workflow process-snapshots.yml --limit 100 --json displayTitle,conclusion \
            --jq '.[] | select(.conclusion == "failure") | .displayTitle' > failed-runs.txt
          NEXT=$(python - <<'PYCATCH'
          import json, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Europe/London")).date().isoformat()
          done = {s["day"] for s in json.load(open("candidate/index.json"))["observation_sources"]}
          failed = {m.group(1) for line in open("failed-runs.txt")
                    for m in [re.search(r"(\d{4}-\d{2}-\d{2}) \(catch-up\)", line)] if m}
          recorded = [d.strip() for d in open("recorded-days.txt") if re.fullmatch(r"\d{4}-\d{2}-\d{2}", d.strip())]
          missing = sorted(d for d in recorded if d < today and d not in done and d not in failed)
          print(missing[0] if missing else "")
          PYCATCH
          )
          if [ -n "$NEXT" ]; then
            echo "::notice::$NEXT was recorded but never published — starting a catch-up run"
            gh workflow run process-snapshots.yml -f day="$NEXT" -f catch_up=true
          else
            echo "Every recorded day before today is published."
          fi
