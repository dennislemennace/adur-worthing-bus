# Cloudflare Worker — community submission relay.
#
# Deploy:  cd worker && npx wrangler deploy
# Local:   cd worker && npx wrangler dev
#
# See README.md for the full first-time setup (KV namespace, secrets, PAT
# scoping, Turnstile keys).

name = "adur-worthing-submissions"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Non-secret config. Secrets go in via `wrangler secret put` — never here.
[vars]
# The repo issues are filed against. PRIVATE: a submission is not public until
# someone has read it. Filing straight into the public repo published whatever
# was sent, names and anything defamatory included, before any review, under
# this project's account. GitHub cannot move an issue from a private repo to a
# public one, so approved items reach the site through scripts/add_*.py.
GITHUB_REPO = "dennislemennace/adur-worthing-bus-inbox"

# Comma-separated origin allowlist. This is the check that stops the endpoint
# being driven from anywhere but the site — keep it tight. Add a localhost
# entry only while testing locally, and take it out again before deploying.
ALLOWED_ORIGINS = "https://worthingbrightonbus.co.uk,https://dennislemennace.github.io"

# What the cron trigger pings to keep the Render free tier awake.
KEEP_WARM_URL = "https://adur-worthing-bus.onrender.com/"

# DEV_UNSAFE = "1" turns off the two checks that stand between this endpoint
# and the GitHub Issues API: the origin allowlist and the requirement that the
# RATE_LIMIT namespace is bound. It exists so `wrangler dev` works without
# either, and it must never be set on a deployed environment. Both checks now
# refuse rather than wave a request through when their configuration is
# missing, so this is the only way to open them.

# Rate-limit counters. Create with:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2d5b7c6b9d9c412e97e03655c98e4b27"

# Keeps request logs available in the dashboard for debugging failed
# submissions (the sender only ever sees a generic error).
[observability]
enabled = true

# Keep the Render API warm. Cloudflare reads crons in UTC: every ten minutes
# from 06:00 to 23:50 UTC covers 07:30 to 23:30 London time in both BST
# (06:30 to 22:30 UTC) and GMT (07:30 to 23:30 UTC). The exact window is
# enforced in keepWarm(), so runs outside it do nothing. About 108 runs a day
# against 100,000 free requests. tests/keep_warm.test.js checks this range
# covers the window in summer and winter.
# The second trigger records the live feed every minute, 05:00 to 00:30 London
# time (enforced in recordSnapshot, so runs outside it do nothing). About 1,170
# snapshots a day against 100,000 free requests. Sampling has to be regular:
# gaps in the record bias every punctuality figure computed from it.
[triggers]
crons = ["*/10 6-23 * * *", "* * * * *"]

# Where snapshots go. Working material, not evidence: the nightly processor
# turns a day into arrival observations and deletes what it has used.
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "adur-worthing-reliability"
